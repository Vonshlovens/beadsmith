[package]
name = "beadsmith-desktop"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false
description = "Prototype native desktop client for Beadsmith, built on Rune."

# A standalone crate: not part of the pnpm project and not a member of any
# other Cargo workspace.
[workspace]

[dependencies]
# Rune is pre-release and asks apps to pin a revision of its fast-forward-only
# `dev` branch. Bump both lines together.
rune = { git = "https://github.com/anomalyco/rune", rev = "cbaf637dfe5fcf3ec8b3f1c3ad27246b69742fbf" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "cbaf637dfe5fcf3ec8b3f1c3ad27246b69742fbf", features = ["markdown"] }
# Pure-Rust MySQL protocol client (Dolt speaks it). No TLS backend yet: see
# desktop/README.md.
mysql = { version = "28", default-features = false, features = ["minimal-rust"] }
