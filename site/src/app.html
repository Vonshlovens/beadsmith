<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon-light.png" />
		<link
			rel="icon"
			type="image/png"
			href="%sveltekit.assets%/favicon-dark.png"
			media="(prefers-color-scheme: dark)"
		/>
		<!--
			Apply the stored appearance before first paint. Mirrors appearance.ts:
			"auto" (or nothing stored) follows the system.
		-->
		<script>
			try {
				var pref = localStorage.getItem('beadsmith-site:appearance');
				var dark =
					pref === 'dark' ||
					(pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
			} catch (error) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
